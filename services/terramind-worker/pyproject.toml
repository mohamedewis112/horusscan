[project]
name = "horusscan-terramind-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.121.0",
  "uvicorn[standard]==0.38.0",
  "httpx==0.28.1",
  "numpy==2.3.4",
  "torch==2.10.0",
  "terratorch==1.2.13"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.vercel]
entrypoint = "app.main:app"
