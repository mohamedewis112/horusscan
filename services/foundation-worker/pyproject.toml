[project]
name = "horusscan-foundation-worker"
version = "0.1.0"
description = "GPU-isolated foundation-model worker for HorusScan"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.121.0",
  "uvicorn[standard]==0.38.0",
  "httpx==0.28.1",
  "numpy==2.3.4",
  "rasterio==1.4.3",
  "pillow==12.0.0",
  "torch==2.14.1",
  "transformers==5.20.2",
  "pystac-client==0.9.1"
]

[project.optional-dependencies]
terratorch = ["terratorch==1.2.13"]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[tool.ruff]
line-length = 100
target-version = "py312"
